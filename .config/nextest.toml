[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# CI runners are slower and noisier than a workstation; PTY tests wait on rendered frames.
[profile.ci]
retries = 2

[test-groups]
pty = { max-threads = 4 }
full-scale = { max-threads = 1 }

# Production-sized transport payloads; these tests are ignored by default and run with
# `cargo nextest run --release --run-ignored only`.
[[profile.default.overrides]]
filter = "test(/production_limits/)"
test-group = "full-scale"
slow-timeout = { period = "300s", terminate-after = 2 }

# This stress case runs four runtime threads while repeatedly encoding full family snapshots.
[[profile.default.overrides]]
filter = "test(=agent_message_daemon_diagnosis::accepted_parent_child_messages_and_burst_feed_cancellation_keep_the_family_live)"
threads-required = 4

# Tests that drive a real PTY wait on rendered frames, so they share a small concurrency budget.
# Names without a `pty` token are listed by module: lib modules that re-execute a
# `*_pty_fixture`, and integration tests that open a PTY: a module of a crate's single `all` test
# binary. Filters avoid package names so they survive crate renames
# and splits.
[[profile.default.overrides]]
filter = """
test(/(^|[_:])pty($|[_:])/)
| (kind(lib) & test(/^terminal::(recovery_tests|daemon_loss_tests|child_config_tests|late_receipt_tests|mode_cycle_tests)::/))
| (kind(lib) & test(/^terminal::console::upgrade::/))
| (kind(lib) & test(/^terminal::login::tests::/))
| (kind(test)
    & test(/^(agent_startup_errors|codex_terminal|monitor_attach|monitor_popup|native_visible_stdio|provider_picker|graceful_upgrade|upgrade_races)::/))
"""
test-group = "pty"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
