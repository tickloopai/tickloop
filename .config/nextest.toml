[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[test-groups]
pty = { max-threads = 4 }
full-scale = { max-threads = 1 }

# Production-sized transport payloads; these tests are ignored by default and run with
# `cargo nextest run --release --run-ignored only`.
[[profile.default.overrides]]
filter = "test(/production_limits/)"
test-group = "full-scale"
slow-timeout = { period = "300s", terminate-after = 2 }

# Tests that drive a real PTY wait on rendered frames, so they share a small concurrency budget.
# Names without a `pty` token are listed by module: lib modules that re-execute a
# `*_pty_fixture`, and integration files that open a PTY. Filters avoid package names so they
# survive crate renames and splits. The binary() clauses match today's per-file test binaries;
# the test() clauses also match their module paths once those files share one test binary.
[[profile.default.overrides]]
filter = """
test(/(^|[_:])pty($|[_:])/)
| binary(/(^|_)pty$/)
| (kind(lib) & test(/^terminal::(recovery_tests|owner_loss_tests|child_config_tests|late_receipt_tests)::/))
| (kind(test)
    & (binary(/^(agent_startup_errors|codex_terminal|monitor_attach|monitor_popup|provider_picker|native_visible_stdio)$/)
       | test(/^(agent_startup_errors|codex_terminal|monitor_attach|monitor_popup|provider_picker)::/)))
"""
test-group = "pty"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
