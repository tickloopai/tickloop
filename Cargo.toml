[workspace]
members = [
    "harness/*", "code/*",
    "tickhost/host", "tickhost/connect",
    "tick/ids", "tick/protocol", "tick/sdk", "tick/packages", "tick/oauth",
    "tick/oauth-test-server", "tick/installer", "tick/plugins",
    "ui",
]
resolver = "3"
exclude = ["vendor/crossterm"]

[workspace.package]
version = "0.2.28"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/tickloopai/tickloop"

[profile.dev]
debug = "line-tables-only"

# Syntect compiles syntax regexes on first use; debug builds must keep that work responsive.
[profile.dev.package.aho-corasick]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

# Loading the embedded o200k_base vocabulary must stay quick in debug builds and tests.
[profile.dev.package.tiktoken-rs]
opt-level = 2

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
