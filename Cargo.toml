[workspace]
members = [
    "agent/*",
    "tickhost/host", "tickhost/connect",
    "tick/protocol", "tick/sdk", "tick/provider",
    "tick/market", "tick/command", "tick/reader", "tick/packages", "tick/test-support",
    "ticks/longbridge", "ticks/futu",
    "ui",
]
resolver = "3"
exclude = ["vendor/crossterm", "vendor/longbridge-oauth"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[profile.dev]
debug = "line-tables-only"

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[patch."https://github.com/longbridge/openapi"]
longbridge-oauth = { path = "vendor/longbridge-oauth" }
