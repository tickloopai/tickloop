[workspace]
members = [
    "agent/*",
    "tickhost/host", "tickhost/connect",
    "tick/protocol", "tick/sdk", "tick/provider",
    "tick/market", "tick/command", "tick/reader", "tick/packages", "tick/oauth",
    "tick/test-support",
    "ui",
]
resolver = "3"
exclude = ["vendor/crossterm"]

[workspace.package]
version = "0.2.17"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/tickloopai/tickloop"
homepage = "https://tickloop.ai"

[profile.dev]
debug = "line-tables-only"

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
