name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  # Homebrew, the native updater and the Cargo launcher all download archives from the tap's Releases.
  TAP_REPOSITORY: tickloopai/homebrew-tap
  FORMULA_TEMPLATE: .github/homebrew/tickloop.rb.in

# Each stage is its own job so a failed stage can be re-run alone ("Re-run failed jobs")
# without rebuilding the archives or recreating the tap's GitHub Release.
jobs:
  prepare:
    name: Check release prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Test the release script
        run: node --test scripts/release.test.mjs scripts/install.test.mjs scripts/release-cargo.test.mjs

      - name: Install stable Rust for the Cargo launcher
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Verify the standalone public Cargo package
        run: |
          node scripts/release-cargo.mjs --check

      - name: Check the Cargo publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Configure CARGO_REGISTRY_TOKEN with permission to publish tickloop before releasing.'
            exit 1
          fi

      - name: Validate release tag against the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tickloop-agent") | .version')
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG must be v followed by the workspace version in Cargo.toml ($version)."
            exit 1
          fi

      - name: Check the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure the HOMEBREW_TAP_TOKEN Actions secret (contents write access to $TAP_REPOSITORY) before releasing binaries."
            exit 1
          fi
          if ! branches=$(gh api "repos/$TAP_REPOSITORY/branches?per_page=1" --jq length); then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read $TAP_REPOSITORY; check that the repository exists and the token covers it."
            exit 1
          fi
          if [ "$branches" = 0 ]; then
            echo "::error::$TAP_REPOSITORY has no commits, so a release tag cannot be created there; push an initial commit (for example a README) first."
            exit 1
          fi

  check:
    name: Check
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the stable Rust toolchain for the target
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add "$PACKAGE_TARGET"

      # Linux archives are static musl programs, so they run on any glibc or musl distribution.
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build the archive
        run: make package PACKAGE_TARGET="$PACKAGE_TARGET"

      # `arch` runs each executable as the target's architecture, so a wrong-architecture archive
      # fails here; the arm64 runner runs the x86_64 archive under Rosetta.
      # On Linux each runner matches its target's architecture and the programs must be static.
      - name: Smoke-test the archive
        run: |
          case "$PACKAGE_TARGET" in
            aarch64-apple-darwin) run() { arch -arm64 "$@"; } ;;
            x86_64-apple-darwin) run() { arch -x86_64 "$@"; } ;;
            *-unknown-linux-musl) run() { "$@"; } ;;
            *) echo "::error::No smoke test for $PACKAGE_TARGET."; exit 1 ;;
          esac
          if [ "$RUNNER_OS" = macOS ] && ! run /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          unpacked=$(mktemp -d)
          tar -xzf "dist/tickloop-$PACKAGE_TARGET.tar.gz" -C "$unpacked"
          printf '%s\n' tickhost tickloop > "$unpacked/expected-files"
          tar -tzf "dist/tickloop-$PACKAGE_TARGET.tar.gz" | LC_ALL=C sort > "$unpacked/archive-files"
          cmp "$unpacked/expected-files" "$unpacked/archive-files"
          for executable in tickloop tickhost; do
            run "$unpacked/$executable" --help > /dev/null
            if [ "$RUNNER_OS" = Linux ] && file "$unpacked/$executable" | grep -q 'dynamically linked'; then
              echo "::error::$executable is not a static program."
              exit 1
            fi
          done

      - name: Write the checksum
        working-directory: dist
        run: shasum -a 256 "tickloop-$PACKAGE_TARGET.tar.gz" > "tickloop-$PACKAGE_TARGET.tar.gz.sha256"

      - name: Keep the archive for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tickloop-${{ matrix.target }}
          path: |
            dist/tickloop-${{ matrix.target }}.tar.gz
            dist/tickloop-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the archives on the tap
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Restore the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tickloop-*
          path: dist
          merge-multiple: true

      - name: Verify the checksums
        working-directory: dist
        run: sha256sum --check --strict -- *.sha256

      # A published version is immutable; a re-run may only add missing identical assets.
      - name: Publish the release on the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$TAP_REPOSITORY" > /dev/null 2>&1; then
            scratch=$(mktemp -d)
            trap 'rm -rf "$scratch"' EXIT
            gh release view "$RELEASE_TAG" --repo "$TAP_REPOSITORY" --json assets --jq '.assets[].name' > "$scratch/assets"
            for asset in dist/*; do
              name=${asset##*/}
              if grep -Fxq "$name" "$scratch/assets"; then
                gh release download "$RELEASE_TAG" --repo "$TAP_REPOSITORY" --pattern "$name" --dir "$scratch"
                cmp "$asset" "$scratch/$name" || { echo "::error::Published asset $name differs; release a new version instead."; exit 1; }
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$TAP_REPOSITORY"
              fi
            done
            gh release edit "$RELEASE_TAG" --repo "$TAP_REPOSITORY" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$TAP_REPOSITORY" \
              --draft \
              --title "Tickloop ${RELEASE_TAG#v}" \
              --notes "Prebuilt macOS and Linux archives of Tickloop ${RELEASE_TAG#v}. Install with: brew install tickloopai/tap/tickloop"
            gh release edit "$RELEASE_TAG" --repo "$TAP_REPOSITORY" --draft=false
          fi

  tap:
    name: Update the Homebrew formula
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tickloop-*
          path: dist
          merge-multiple: true

      - name: Render the formula
        run: |
          checksum() { cut -d ' ' -f 1 "dist/tickloop-$1.tar.gz.sha256"; }
          sed \
            -e "s/@VERSION@/${RELEASE_TAG#v}/g" \
            -e "s/@AARCH64_SHA256@/$(checksum aarch64-apple-darwin)/g" \
            -e "s/@X86_64_SHA256@/$(checksum x86_64-apple-darwin)/g" \
            -e "s/@LINUX_AARCH64_SHA256@/$(checksum aarch64-unknown-linux-musl)/g" \
            -e "s/@LINUX_X86_64_SHA256@/$(checksum x86_64-unknown-linux-musl)/g" \
            "$FORMULA_TEMPLATE" > "$RUNNER_TEMP/tickloop.rb"
          if grep -n '@[A-Z0-9_]*@' "$RUNNER_TEMP/tickloop.rb"; then
            echo '::error::The rendered formula still has template placeholders.'
            exit 1
          fi
          ruby -c "$RUNNER_TEMP/tickloop.rb"

      - name: Push the formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$tap"
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/tickloop.rb" "$tap/Formula/tickloop.rb"
          git -C "$tap" add Formula/tickloop.rb
          if git -C "$tap" diff --cached --quiet; then
            echo "Formula/tickloop.rb already describes $RELEASE_TAG."
            exit 0
          fi
          git -C "$tap" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "tickloop ${RELEASE_TAG#v}"
          git -C "$tap" push origin HEAD

      - name: Record release
        run: |
          {
            printf '### Tickloop %s\n\n' "$RELEASE_TAG"
            printf 'Archives: https://github.com/%s/releases/tag/%s\n\n' "$TAP_REPOSITORY" "$RELEASE_TAG"
            printf 'Homebrew: brew install tickloopai/tap/tickloop\n'
          } >> "$GITHUB_STEP_SUMMARY"

  cargo-registry:
    name: Publish the Cargo installer
    needs: publish
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install stable Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Test the complete installer against the published application
        run: |
          cargo test --locked --manifest-path distribution/cargo/Cargo.toml --target-dir target/cargo-launcher
          cargo clippy --locked --manifest-path distribution/cargo/Cargo.toml --target-dir target/cargo-launcher --all-targets -- -D warnings

      - name: Verify installation against the published application
        run: |
          cargo install --locked --path distribution/cargo --root "$RUNNER_TEMP/cargo-smoke" --target-dir target/cargo-launcher
          /usr/bin/sandbox-exec -p '(version 1) (allow default) (deny network*)' "$RUNNER_TEMP/cargo-smoke/bin/tickloop" --help
          "$RUNNER_TEMP/cargo-smoke/bin/tickhost" --help
          "$RUNNER_TEMP/cargo-smoke/bin/tl" --version

      - name: Publish only the installer crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/release-cargo.mjs --publish

      - name: Verify anonymous installation from crates.io
        run: |
          cargo install --locked --registry crates-io --version "${RELEASE_TAG#v}" --root "$RUNNER_TEMP/cargo-registry-smoke" --target-dir target/cargo-launcher tickloop
          /usr/bin/sandbox-exec -p '(version 1) (allow default) (deny network*)' "$RUNNER_TEMP/cargo-registry-smoke/bin/tickloop" --help
          "$RUNNER_TEMP/cargo-registry-smoke/bin/tickhost" --help
          "$RUNNER_TEMP/cargo-registry-smoke/bin/tl" --version
          {
            printf '### Cargo installer %s\n\n' "$RELEASE_TAG"
            printf 'https://crates.io/crates/tickloop/%s\n\n' "${RELEASE_TAG#v}"
            printf 'Install: cargo install --locked tickloop\n'
          } >> "$GITHUB_STEP_SUMMARY"

  cargo-registry-linux:
    name: Verify the Cargo installer on Linux
    needs: cargo-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install stable Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Verify anonymous installation from crates.io
        run: |
          cargo install --locked --registry crates-io --version "${RELEASE_TAG#v}" --root "$RUNNER_TEMP/cargo-registry-smoke" tickloop
          for program in tickloop tickhost; do
            "$RUNNER_TEMP/cargo-registry-smoke/bin/$program" --help > /dev/null
          done
          "$RUNNER_TEMP/cargo-registry-smoke/bin/tl" --version
