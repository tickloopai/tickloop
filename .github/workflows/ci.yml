name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  # The popup and Herdr view tests run a private server of this release.
  HERDR_VERSION: 0.9.0
  HERDR_MACOS_AARCH64_SHA256: 32b53df09872628059c789a69f02a6b8e29e14ddf26711421f3463f70c1aef17

# The Cargo launcher's build downloads the release matching its version, which does not exist yet
# when a version commit lands, so CI checks the workspace only; release.yml verifies the launcher.
jobs:
  check:
    name: Format, lint and test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Install Herdr
        run: |
          herdr="$RUNNER_TEMP/herdr/bin/herdr"
          mkdir -p "${herdr%/*}"
          curl --fail --silent --show-error --location --retry 3 --output "$herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-macos-aarch64"
          echo "$HERDR_MACOS_AARCH64_SHA256  $herdr" | shasum -a 256 --check --strict
          chmod +x "$herdr"
          "$herdr" --version
          echo "${herdr%/*}" >> "$GITHUB_PATH"

      - name: Restore the Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-

      - name: Test the release and install scripts
        run: node --test scripts/release.test.mjs scripts/install.test.mjs scripts/release-cargo.test.mjs

      - name: Format, lint and test the workspace
        run: make check-workspace
