# Modified by Tick Loop: standalone dependencies pinned to the upstream SDK revision.
[package]
name = "longbridge-oauth"
version = "4.5.0"
edition = "2024"
description = "Longbridge OpenAPI OAuth 2.0 client for Rust"
license = "MIT OR Apache-2.0"
publish = false

[features]
blocking = ["tokio/rt-multi-thread"]

[dependencies]
dirs = "6"
futures-util = "0.3.31"
longbridge-geo = { git = "https://github.com/longbridge/openapi", rev = "5929410" }
oauth2 = "4.4"
poem = "3.1.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.15"
tokio = { version = "1.47.1", features = ["rt", "time", "sync", "net"] }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
