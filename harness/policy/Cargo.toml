[package]
name = "tickloop-harness-policy"
description = "Harness policy, Skills and Settings Store contract"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tickloop-harness-base = { path = "../base" }
tickloop-harness-cron = { path = "../cron" }
tickloop-harness-model = { path = "../model" }
tickloop-harness-protocol = { path = "../protocol" }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
