[package]
name = "tickloop-harness-tools"
description = "Agent tools, permission rules and file change records"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
grep-printer = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
htmd = "0.5"
ignore = "0.4"
libc = "0.2"
regex = "1"
scraper = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
thiserror = "2"
tickloop-harness-base = { path = "../base" }
tickloop-harness-protocol = { path = "../protocol" }
tickloop-ids = { path = "../../tick/ids" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
