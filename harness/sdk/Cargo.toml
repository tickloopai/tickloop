[package]
name = "tickloop-harness"
description = "The shared Tickloop Harness API for hosts"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[test]]
name = "all"
required-features = ["tools"]

[features]
default = []
base = ["dep:tickloop-harness-base"]
engine = ["base", "policy", "dep:tickloop-harness-runtime", "tools", "model", "transcript", "cron", "artifacts"]
tools = ["base", "dep:tickloop-harness-tools"]
policy = ["base", "dep:tickloop-harness-policy"]
model = ["base", "dep:tickloop-harness-model"]
transcript = ["dep:tickloop-harness-transcript"]
cron = ["dep:tickloop-harness-cron"]
artifacts = ["base", "dep:tickloop-harness-artifacts"]
connector = ["base", "dep:tickloop-harness-connector"]
test-support = ["engine", "dep:tickloop-harness-test-support"]

[dependencies]
tickloop-harness-policy = { path = "../policy", optional = true }
tickloop-harness-base = { path = "../base", optional = true }
tickloop-harness-connector = { path = "../connector", optional = true }
tickloop-harness-protocol = { path = "../protocol" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-harness-runtime = { path = "../runtime", optional = true }
tickloop-harness-tools = { path = "../tools", optional = true }
tickloop-harness-model = { path = "../model", optional = true }
tickloop-harness-transcript = { path = "../transcript", optional = true }
tickloop-harness-cron = { path = "../cron", optional = true }
tickloop-harness-artifacts = { path = "../artifacts", optional = true }
tickloop-harness-test-support = { path = "../test-support", optional = true }
