    effort_levels:
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
    input_modalities:
      - "text"
      - "image"
  - id: "gpt-5.6-terra"
    display_name: "GPT-5.6 Terra"
    adapter: "codex_responses"
    max_output_tokens: 128000
    context_window_tokens: 272000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels:
      - "low"
