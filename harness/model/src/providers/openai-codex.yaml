connection:
  vendor: "OpenAI"
  product: "Codex subscription"
  kind: "plan"
  order: 0
  discovery: "codex"
id: "openai-codex"
display_name: "Codex subscription"
auth: "codex_subscription"
api_key_env: ""
endpoints:
  codex_responses: "https://chatgpt.com/backend-api/codex/responses"
selection:
  auxiliary_model: gpt-6-luna
  series:
    - id: "sol"
      name: "GPT Sol"
      model: "gpt-6.1-sol"
      capability_order: 1
    - id: "astra"
      name: "GPT Astra"
      model: "gpt-6-astra"
      capability_order: 0
    - id: "terra"
      name: "GPT Terra"
      model: "gpt-5.6-terra"
      capability_order: 2
    - id: "luna"
      name: "GPT Luna"
      model: "gpt-6-luna"
      capability_order: 3
models:
  - id: "gpt-5.5"
    display_name: "GPT-5.5"
    adapter: "codex_responses"
    max_output_tokens: 128000
    context_window_tokens: 272000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels:
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
    input_modalities:
      - "text"
      - "image"
  - id: "gpt-5.6-sol"
    display_name: "GPT-5.6 Sol"
    adapter: "codex_responses"
    max_output_tokens: 128000
