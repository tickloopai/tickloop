connection:
  vendor: "OpenAI"
  product: "Pay-as-you-go API"
  kind: "pay_as_you_go"
  order: 0
  discovery: "openai_api"
id: "openai-api"
display_name: "OpenAI API"
auth: "api_key_env"
api_key_env: "OPENAI_API_KEY"
endpoints:
  responses: "https://api.openai.com/v1"
selection:
  auxiliary_model: gpt-6-luna
  series:
    - id: "astra"
      name: "GPT Astra"
      model: "gpt-6-astra"
      capability_order: 0
    - id: "sol"
      name: "GPT Sol"
      model: "gpt-6.1-sol"
      capability_order: 1
    - id: "terra"
      name: "GPT Terra"
      model: "gpt-5.6-terra"
      capability_order: 2
    - id: "luna"
      name: "GPT Luna"
      model: "gpt-6-luna"
      capability_order: 3
models:
  - id: "gpt-6-astra"
    display_name: "GPT-6 Astra"
    adapter: "responses"
    native_tool_search: "openai"
    max_output_tokens: 128000
    context_window_tokens: 1050000
    thinking: "always_on"
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
  - id: "gpt-6.1-sol"
    display_name: "GPT-6.1 Sol"
    adapter: "responses"
    native_tool_search: "openai"
    max_output_tokens: 128000
    context_window_tokens: 1050000
    thinking: "always_on"
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
  - id: "gpt-5.6-terra"
    display_name: "GPT-5.6 Terra"
    adapter: "responses"
    native_tool_search: "openai"
    max_output_tokens: 128000
    context_window_tokens: 1050000
    thinking: "toggle"
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
  - id: "gpt-6-luna"
    display_name: "GPT-6 Luna"
    adapter: "responses"
    native_tool_search: "openai"
    max_output_tokens: 128000
    context_window_tokens: 1050000
    thinking: "toggle"
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
