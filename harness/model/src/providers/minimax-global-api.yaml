connection:
  vendor: "MiniMax"
  product: "API"
  kind: "service"
  order: 0
  discovery: "unsupported"
  region: { name: "International", order: 1 }
id: "minimax-global-api"
display_name: "MiniMax Global API"
auth: "api_key_env"
api_key_env: "MINIMAX_GLOBAL_API_KEY"
endpoints:
  minimax_messages: "https://api.minimax.io/anthropic"
selection:
  auxiliary_model: MiniMax-M3
  notice: "API keys may carry different products and quotas; authentication alone does not establish pay-as-you-go billing."
  series:
    - id: "minimax"
      name: "MiniMax"
      model: "MiniMax-M3"
      capability_order: 0
    - id: "minimax-flash"
      name: "MiniMax Flash"
      model: "MiniMax-M3.1-Flash"
      capability_order: 1
models:
  - id: "MiniMax-M3.1-Flash"
    display_name: "MiniMax-M3.1-Flash"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: true
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
    temperature_control: "unsupported"
  - id: "MiniMax-M3"
    display_name: "MiniMax-M3"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels: []
    input_modalities: ["text", "image"]
