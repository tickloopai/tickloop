---
id: google-gemini-api
display_name: Google Developer API
connection:
  vendor: Google
  product: Developer API
  kind: pay_as_you_go
  order: 0
  discovery: provider_api
auth: api_key_env
api_key_env: GEMINI_API_KEY
endpoints:
  google: https://generativelanguage.googleapis.com/v1beta
selection:
  auxiliary_model: gemini-3.5-flash-lite
  series:
  - id: flash
    name: Gemini Flash
    model: gemini-3.8-flash
    capability_order: 1
  - id: flash-lite
    name: Gemini Flash-Lite
    model: gemini-3.5-flash-lite
    capability_order: 2
  - id: argon
    name: Gemini Argon
    model: gemini-4-argon
    capability_order: 0
models:
- id: gemini-3.8-flash
  display_name: Gemini 3.8 Flash
  adapter: google
  max_output_tokens: 65536
  context_window_tokens: 1048576
  thinking: always_on
  effort_levels:
  - low
  - medium
  - high
  input_modalities:
  - text
  - image
- id: gemini-3.5-flash-lite
  display_name: Gemini 3.5 Flash-Lite
  adapter: google
  max_output_tokens: 65536
  context_window_tokens: 1048576
  thinking: always_on
  effort_levels:
  - low
  - medium
  - high
  input_modalities:
  - text
  - image
- id: gemini-4-argon
  display_name: Gemini 4 Argon
  adapter: google
  max_output_tokens: 65536
  context_window_tokens: 1048576
  thinking: always_on
  effort_levels: [low, medium, high]
  input_modalities: [text, image]
  temperature_control: unsupported
