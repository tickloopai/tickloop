[package]
name = "tickloop-harness-model"
description = "Agent model clients, provider sign-in and typed judgments"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
htmd = "0.5"
http = "1"
icu_normalizer = "2"
icu_properties = "2"
libc = "0.2"
jsonschema = { version = "0.56", default-features = false }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = { version = "3", optional = true }
thiserror = "2"
tickloop-harness-base = { path = "../base" }
tickloop-harness-protocol = { path = "../protocol" }
tickloop-ids = { path = "../../tick/ids" }
tiktoken-rs = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
web_atoms = "0.2"

[dev-dependencies]
hyper-util = { version = "0.1", features = ["client-proxy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3"
tickloop-harness-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["full", "test-util"] }

[features]
# Exposes test-only seams (loopback Codex clients, fixture titles, test endpoints) to the tests of
# the Agent crates above; never enabled by a build.
test-support = ["dep:tempfile"]
