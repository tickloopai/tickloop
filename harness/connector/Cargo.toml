[package]
name = "tickloop-harness-connector"
description = "Remote MCP Server login: OAuth discovery, client registration, authorization code with PKCE, renewal and logout"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
rmcp = { version = "3.8.0", default-features = false, features = ["auth", "client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tickloop-harness-base = { path = "../base" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-oauth = { path = "../../tick/oauth" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tickloop-tick-oauth-test-server = { path = "../../tick/oauth-test-server" }
tokio = { version = "1", features = ["full", "test-util"] }
