[package]
name = "tickloop-agent-console"
description = "Agent Console: the terminal View that reaches Agents through AgentAccess"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.29"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = { version = "2.7", features = ["inline"] }
tempfile = "3"
thiserror = "2"
tickloop-agent-artifacts = { path = "../artifacts" }
tickloop-agent-base = { path = "../base" }
tickloop-agent-client = { path = "../client" }
tickloop-agent-config = { path = "../config" }
tickloop-agent-model = { path = "../model" }
tickloop-agent-packages = { path = "../packages" }
tickloop-agent-protocol = { path = "../protocol" }
tickloop-agent-tools = { path = "../tools" }
tickloop-agent-updater = { path = "../updater" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tickloop-ui = { path = "../../ui", features = ["code-highlight"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16.2"

[dev-dependencies]
jsonschema = { version = "0.56", default-features = false }
portable-pty = "0.9"
tickloop-agent-daemon = { path = "../daemon" }
tickloop-agent-runtime = { path = "../runtime" }
tickloop-agent-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["full", "test-util"] }
