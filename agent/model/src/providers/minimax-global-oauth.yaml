connection:
  vendor: "MiniMax"
  product: "Portal"
  kind: "service"
  order: 1
  discovery: "unsupported"
  region: { name: "International", order: 1 }
id: "minimax-global-oauth"
display_name: "MiniMax Global OAuth"
auth: "minimax_oauth_global"
api_key_env: ""
endpoints:
  minimax_messages: "https://api.minimax.io/anthropic"
selection:
  auxiliary_model: MiniMax-M3
  notice: "Portal account product and quota apply. Flash Preview requires eligible M Plan access; authorization alone does not confirm model permission."
  series:
    - id: "minimax"
      name: "MiniMax"
      model: "MiniMax-M3"
      capability_order: 0
    - id: "minimax-flash-preview"
      name: "MiniMax Flash Preview"
      model: "MiniMax-M3.1-Flash-Preview"
      capability_order: 1
models:
  - id: "MiniMax-M3"
    display_name: "MiniMax-M3"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels: []
    input_modalities: ["text", "image"]
  - id: "MiniMax-M3.1-Flash-Preview"
    display_name: "MiniMax-M3.1-Flash-Preview"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: true
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
