connection:
  vendor: "DeepSeek"
  product: "Pay-as-you-go API"
  kind: "pay_as_you_go"
  order: 0
  discovery: "unsupported"
id: "deepseek-api"
display_name: "DeepSeek API"
auth: "api_key_env"
api_key_env: "DEEPSEEK_API_KEY"
endpoints:
  deepseek_chat_completions: "https://api.deepseek.com"
selection:
  auxiliary_model: deepseek-flash
  series:
    - id: "deepseek-flash"
      name: "DeepSeek Flash"
      model: "deepseek-flash"
      capability_order: 1
    - id: "deepseek-pro"
      name: "DeepSeek Pro"
      model: "deepseek-v4-pro"
      capability_order: 0
models:
  - id: "deepseek-flash"
    display_name: "DeepSeek-V4.1-Flash"
    adapter: "deepseek_chat_completions"
    max_output_tokens: 64000
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels:
      - "low"
      - "high"
      - "max"
    input_modalities:
      - "text"
      - "image"
  - id: "deepseek-v4-pro"
    display_name: "DeepSeek-V4-Pro-0813"
    adapter: "deepseek_chat_completions"
    max_output_tokens: 64000
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels:
      - "low"
      - "high"
      - "max"
    input_modalities:
      - "text"
  - id: "deepseek-v4-flash"
    display_name: "DeepSeek-V4.1-Flash"
    adapter: "deepseek_chat_completions"
    max_output_tokens: 64000
    context_window_tokens: null
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels:
      - "low"
      - "high"
      - "max"
    input_modalities:
      - "text"
