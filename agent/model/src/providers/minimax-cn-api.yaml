connection:
  vendor: "MiniMax"
  product: "API"
  kind: "service"
  order: 0
  discovery: "unsupported"
  region: { name: "China", order: 0 }
id: "minimax-cn-api"
display_name: "MiniMax China API"
auth: "api_key_env"
api_key_env: "MINIMAX_CN_API_KEY"
endpoints:
  minimax_messages: "https://api.minimax.cn/anthropic"
selection:
  auxiliary_model: MiniMax-M3
  notice: "API keys may carry different products and quotas; authentication alone does not establish pay-as-you-go billing."
  series:
    - id: "minimax"
      name: "MiniMax"
      model: "MiniMax-M3"
      capability_order: 0
models:
  - id: "MiniMax-M3"
    display_name: "MiniMax-M3"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels: []
    input_modalities: ["text", "image"]
