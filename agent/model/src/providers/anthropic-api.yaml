  order: 0
  discovery: "provider_api"
id: "anthropic-api"
display_name: "Anthropic API"
auth: "api_key_env"
api_key_env: "ANTHROPIC_API_KEY"
endpoints:
  messages: "https://api.anthropic.com"
selection:
