connection:
  vendor: "Zhipu GLM"
  product: "Pay-as-you-go API"
  kind: "pay_as_you_go"
  order: 0
  discovery: "unsupported"
  region: { name: "China", order: 0 }
id: "zhipu-cn-api"
display_name: "Zhipu China API"
auth: "api_key_env"
api_key_env: "ZHIPU_API_KEY"
endpoints:
  glm_chat_completions: "https://open.bigmodel.cn/api/paas/v4"
selection:
  auxiliary_model: glm-4.7-flash
  series:
    - id: "glm"
      name: "GLM"
      model: "glm-5.3"
      capability_order: 0
    - id: "glm-flash"
      name: "GLM Flash"
      model: "glm-5.3-flash"
      capability_order: 1
    - id: "glm-flashx"
      name: "GLM FlashX"
      model: "glm-5.3-flashx"
      capability_order: 2
    - id: "glm-air"
      name: "GLM Air"
      model: "glm-4.5-air"
      capability_order: 3
    - id: "glm-flash-small"
      name: "GLM Flash 30B"
      model: "glm-4.7-flash"
      capability_order: 4
models:
  - id: "glm-5.3"
    display_name: "GLM-5.3"
    adapter: "glm_chat_completions"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: false
    effort_levels: ["low", "high", "max"]
    input_modalities: ["text"]
  - id: "glm-5.3-flash"
