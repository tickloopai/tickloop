[package]
name = "tickloop-agent-daemon"
description = "Agent daemon and worker processes: the AgentAccess server and the embedded Agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
tickloop-agent-access = { path = "../access" }
tickloop-agent-artifacts = { path = "../artifacts" }
tickloop-agent-client = { path = "../client" }
tickloop-agent-config = { path = "../config" }
tickloop-agent-model = { path = "../model" }
tickloop-agent-protocol = { path = "../protocol" }
tickloop-agent-runtime = { path = "../runtime" }
tickloop-agent-tools = { path = "../tools" }
tickloop-agent-updater = { path = "../updater" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost = { path = "../../tickhost/host" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
tempfile = "3"
tickloop-agent-access = { path = "../access", features = ["test-support"] }
tickloop-agent-base = { path = "../base" }
tickloop-agent-test-support = { path = "../test-support" }
tickloop-agent-transcript = { path = "../transcript" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
unicode-width = "0.2"
