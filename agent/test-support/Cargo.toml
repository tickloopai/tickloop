[package]
name = "tickloop-agent-test-support"
description = "Test code shared by the Agent crates' tests: a scripted model, Transcript stores, PTY screens and model HTTP servers"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
regex = "1"
serde_json = "1"
tickloop-agent-config = { path = "../config" }
# The tests of every Agent crate reach the model's test-only seams through this crate.
tickloop-agent-model = { path = "../model", features = ["test-support"] }
tickloop-agent-protocol = { path = "../protocol" }
# The in-memory Transcript store implements the runtime's TranscriptStore seam.
tickloop-agent-runtime = { path = "../runtime" }
tickloop-agent-transcript = { path = "../transcript" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tickloop-agent-artifacts = { path = "../artifacts" }
tickloop-agent-base = { path = "../base" }
