[package]
name = "tickloop-agent-artifacts"
description = "Agent client of the Artifact Service: device login, credentials and catalog"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tickloop-agent-base = { path = "../base" }
tickloop-agent-protocol = { path = "../protocol" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-oauth = { path = "../../tick/oauth" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tickloop-tick-oauth-test-server = { path = "../../tick/oauth-test-server" }
