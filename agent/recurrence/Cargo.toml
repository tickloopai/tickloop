[package]
name = "tickloop-agent-recurrence"
description = "Wall-clock recurrence rules for Loop Triggers: parsing, canonical text and next run"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
serde = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
