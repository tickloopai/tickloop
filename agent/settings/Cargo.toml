[package]
name = "tickloop-agent-settings"
description = "Agent user settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-agent-runtime = { path = "../runtime", optional = true }
tickloop-agent-policy = { path = "../policy" }
tickloop-tick-installer = { path = "../../tick/installer" }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tickloop-agent-base = { path = "../base" }
tickloop-agent-cron = { path = "../cron" }
tickloop-agent-model = { path = "../model" }
tickloop-agent-protocol = { path = "../protocol" }
tickloop-agent-tools = { path = "../tools" }
tickloop-tick-packages = { path = "../../tick/packages" }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tickloop-agent-test-support = { path = "../test-support" }
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
test-support = ["dep:tickloop-agent-runtime"]
