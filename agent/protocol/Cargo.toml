[package]
name = "tickloop-agent-protocol"
description = "Agent domain types and AgentAccess wire definitions shared by every Agent layer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tickloop-agent-recurrence = { path = "../recurrence" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tokio = { version = "1", default-features = false, features = ["sync"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
