[package]
name = "tickloop-agent-runtime"
description = "Agent runtime: Loops, Subagents, Transcripts, Tick streams and host tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
fastrand = "2"
futures-util = "0.3"
http = "1"
icu_normalizer = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonschema = { version = "0.56", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-streamable-http-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sse-stream = "0.2.4"
thiserror = "2"
tickloop-agent-artifacts = { path = "../artifacts" }
tickloop-agent-base = { path = "../base" }
tickloop-agent-config = { path = "../config" }
tickloop-agent-model = { path = "../model" }
tickloop-agent-protocol = { path = "../protocol" }
tickloop-agent-tools = { path = "../tools" }
tickloop-agent-transcript = { path = "../transcript" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost = { path = "../../tickhost/host" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
base64 = "0.22"
percent-encoding = "2"
serde_yaml_ng = "0.10"
tempfile = "3"
tickloop-agent-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
