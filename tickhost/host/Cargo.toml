[package]
name = "tickloop-tickhost"
description = "The tickhost executable and library: runs Agent-opened extension Ticks in private PTYs and connects protocol programs to Agents"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tickhost"
doctest = false

[[bin]]
name = "tickhost"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tickloop-tickhost-connect = { path = "../connect" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# A real terminal model for hidden TUIs: ANSI state, CJK width, alternate screen, resize and
# bounded scrollback. Kept inside this crate; nothing else parses the PTY.
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[build-dependencies]
sha2 = "0.10"
toml = "0.8"
