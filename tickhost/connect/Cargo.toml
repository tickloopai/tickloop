[package]
name = "tickloop-tickhost-connect"
description = "Host-side access to Ticks: per-instance Tick Sessions, the hosted launch contract and Herdr as the layout host of Tick views"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tickhost_connect"
doctest = false

[dependencies]
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
vt100 = "0.16.2"
