[package]
name = "tickloop-ticks"
description = "Tick Loop Tick Commands for market, account, and news views"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tickloop_ticks"
doctest = false

[[bin]]
name = "tick"
path = "src/main.rs"

[features]
live-api = []

[dependencies]
quick-xml = { version = "0.38", features = ["serialize"] }
libc = "0.2"
futures-util = "0.3"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-stream = { version = "0.1", features = ["signal"] }
async-trait = "0.1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
ratatui = "0.30"
tickloop-ui = { path = "../ui" }
tick-connect = { path = "../tick-connect" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
longbridge = { git = "https://github.com/longbridge/openapi", rev = "5929410" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
scraper = "0.22"
sha1 = "0.10"
time-tz = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-std", "io-util", "net", "sync"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
schemars = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tickloop-tickhost = { path = "../tickhost" }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"
