[package]
name = "tickloop-agent"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "tickloop"
autobins = false
autotests = false

[lib]
doctest = false

[[bin]]
name = "tickloop"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "cli_fixture"
path = "tests/support/cli_fixture_main.rs"
harness = false

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.29"
fastrand = "2"
futures-util = "0.3"
http = "1"
icu_normalizer = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonschema = { version = "0.56", default-features = false }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-streamable-http-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
sse-stream = "0.2.4"
tempfile = "3"
thiserror = "2"
tickloop-agent-artifacts = { path = "../../agent/artifacts" }
tickloop-agent-base = { path = "../../agent/base" }
tickloop-agent-config = { path = "../../agent/config" }
tickloop-agent-model = { path = "../../agent/model" }
tickloop-agent-protocol = { path = "../../agent/protocol" }
tickloop-agent-tools = { path = "../../agent/tools" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost = { path = "../../tickhost/host" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tickloop-ui = { path = "../ui" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
percent-encoding = "2"
portable-pty = "0.9"
serde_yaml_ng = "0.10"
tickloop-agent-model = { path = "../../agent/model", features = ["test-support"] }
tickloop-agent-test-support = { path = "../../agent/test-support" }
vt100 = "0.16.2"
