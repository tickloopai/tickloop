[package]
name = "tickloop-agent"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "tickloop"
autobins = false

[[bin]]
name = "tickloop"
path = "src/main.rs"

[[test]]
name = "cli_fixture"
path = "tests/support/cli_fixture_main.rs"
harness = false

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
async-trait = "0.1"
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["client-proxy"] }
base64 = "0.22"
crossterm = "0.29"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-width = "0.2"
unicode-segmentation = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-streamable-http-client"] }
sse-stream = "0.2.4"
http = "1"
jsonschema = { version = "0.56", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
ring = "0.17"
similar = "2.7"
tickloop-ui = { path = "../ui" }
tick-connect = { path = "../tick-connect" }
tickloop-tick-host = { path = "../tick-host" }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

regex = "1"
ignore = "0.4"
grep-matcher = "0.1"
grep-printer = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
libc = "0.2"
icu_normalizer = "2"
htmd = "0.5"
shell-words = "1"

[dev-dependencies]
portable-pty = "0.9"
