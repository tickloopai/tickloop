id: "minimax-cn-oauth"
display_name: "MiniMax China OAuth"
auth: "minimax_oauth_cn"
api_key_env: ""
endpoints:
  minimax_messages: "https://api.minimaxi.com/anthropic"
models:
  - id: "minimax-m3-messages"
    service_model_id: "MiniMax-M3"
    display_name: "MiniMax M3"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels: []
    input_modalities: ["text", "image"]
  - id: "minimax-m3-1-flash-preview-messages"
    service_model_id: "MiniMax-M3.1-Flash-Preview"
    display_name: "MiniMax M3.1 Flash Preview (M Plan)"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: true
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text", "image"]
