id: "zhipu-cn-api"
display_name: "Zhipu China API"
auth: "api_key_env"
api_key_env: "ZHIPU_API_KEY"
endpoints:
  glm_chat_completions: "https://open.bigmodel.cn/api/paas/v4"
models:
  - id: "glm-5.3-chat-completions"
    service_model_id: "glm-5.3"
    display_name: "GLM-5.3"
    adapter: "glm_chat_completions"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: false
    effort_levels: ["low", "high", "max"]
    input_modalities: ["text"]
  - id: "glm-5.3-flash-chat-completions"
    service_model_id: "glm-5.3-flash"
    display_name: "GLM-5.3-Flash"
    adapter: "glm_chat_completions"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: false
    effort_levels: ["low", "high", "max"]
    input_modalities: ["text", "image"]
  - id: "glm-5.3-flashx-chat-completions"
    service_model_id: "glm-5.3-flashx"
    display_name: "GLM-5.3-FlashX"
    adapter: "glm_chat_completions"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "always_on"
    adaptive_by_default: false
    effort_levels: ["low", "high", "max"]
    input_modalities: ["text", "image"]
  - id: "glm-5.2-chat-completions"
    service_model_id: "glm-5.2"
    display_name: "GLM-5.2"
    adapter: "glm_chat_completions"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels: ["high", "max"]
    input_modalities: ["text"]
