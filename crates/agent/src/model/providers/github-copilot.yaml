    max_output_tokens: 128000
    context_window_tokens: 272000
    thinking: "always_on"
    effort_levels: ["low", "medium", "high", "xhigh", "max"]
    input_modalities: ["text"]
  - id: "gpt-6-astra"
    service_model_id: "gpt-6-astra"
