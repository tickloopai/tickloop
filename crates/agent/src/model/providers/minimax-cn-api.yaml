id: "minimax-cn-api"
display_name: "MiniMax China API"
auth: "api_key_env"
api_key_env: "MINIMAX_CN_API_KEY"
endpoints:
  minimax_messages: "https://api.minimax.cn/anthropic"
models:
  - id: "minimax-m3-messages"
    service_model_id: "MiniMax-M3"
    display_name: "MiniMax M3"
    adapter: "minimax_messages"
    max_output_tokens: 131072
    context_window_tokens: 1000000
    thinking: "toggle"
    adaptive_by_default: false
    effort_levels: []
    input_modalities: ["text", "image"]
