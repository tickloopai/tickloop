[package]
name = "tickloop-tickhost"
description = "Local service that runs Agent-opened protocol Ticks in private PTYs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tickhost"
doctest = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tick-connect = { path = "../tick-connect" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
# A real terminal model for hidden TUIs: ANSI state, CJK width, alternate screen, resize and
# bounded scrollback. Kept inside this crate; nothing else parses the PTY.
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"
