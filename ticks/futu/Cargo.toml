[package]
name = "tickloop-tick-futu"
description = "Futu OpenD option chains and quotes, and tick-futu, which runs the Options Tick on them"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "tick_futu"
doctest = false

[[bin]]
name = "tick-futu"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tickloop-tick-command = { path = "../../tick/command" }
tickloop-tick-market = { path = "../../tick/market" }
tickloop-tick-provider = { path = "../../tick/provider" }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tickloop-tick-packages = { path = "../../tick/packages" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
