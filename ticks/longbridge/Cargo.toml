[package]
name = "tickloop-tick-longbridge"
description = "Longbridge quotes, trading account, news and community posts, with the package's OAuth login and rate limits, and tick-longbridge, which runs the Ticks that read them and can log in on its own"
version = "0.2.2"
edition.workspace = true
publish.workspace = true

[lib]
name = "tick_longbridge"
doctest = false

[[bin]]
name = "tick-longbridge"
path = "src/main.rs"

[features]
live-api = []

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
libc = "0.2"
longbridge = { git = "https://github.com/longbridge/openapi", rev = "5929410" }
quick-xml = { version = "0.38", features = ["serialize"] }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tickloop-tick-command = { path = "../../tick/command" }
tickloop-tick-market = { path = "../../tick/market" }
tickloop-tick-oauth = { path = "../../tick/oauth" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-provider = { path = "../../tick/provider" }
tickloop-ui = { path = "../../ui" }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
time-tz = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tickloop-tick-sdk = { path = "../../tick/sdk" }
tickloop-tick-test-support = { path = "../../tick/test-support" }
tokio = { version = "1", features = ["test-util"] }
vt100 = "0.16.2"
