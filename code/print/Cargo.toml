[package]
name = "tickloop-code-print"
description = "Non-interactive print adapter over AgentAccess"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk", features = [] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tickloop-code-client = { path = "../client" }
tickloop-code-settings = { path = "../settings" }
tickloop-code-access = { path = "../access" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
