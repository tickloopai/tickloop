[package]
name = "tickloop-code-settings"
description = "Agent user settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
libc = "0.2"
tokio = { version = "1", features = ["time"] }
tickloop-harness = { path = "../../harness/sdk", features = ["model", "policy", "tools", "connector"] }
tickloop-tick-installer = { path = "../../tick/installer" }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-plugins = { path = "../../tick/plugins" }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tickloop-tick-oauth-test-server = { path = "../../tick/oauth-test-server" }
tokio-util = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tickloop-harness = { path = "../../harness/sdk", features = ["cron", "test-support"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
test-support = ["tickloop-harness/engine"]
