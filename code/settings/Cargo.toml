[package]
name = "tickloop-code-settings"
description = "Agent user settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["model", "policy", "tools"] }
tickloop-tick-installer = { path = "../../tick/installer" }
regex = "1"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tickloop-tick-packages = { path = "../../tick/packages" }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["cron", "test-support"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
test-support = ["tickloop-harness/engine"]
