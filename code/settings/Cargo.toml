[package]
name = "tickloop-code-settings"
description = "Agent user settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["policy"] }
tickloop-tick-installer = { path = "../../tick/installer" }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tickloop-harness-base = { path = "../../harness/base" }
tickloop-harness-model = { path = "../../harness/model" }
tickloop-harness-protocol = { path = "../../harness/protocol" }
tickloop-harness-tools = { path = "../../harness/tools" }
tickloop-tick-packages = { path = "../../tick/packages" }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["cron"] }
tempfile = "3"
tickloop-harness-test-support = { path = "../../harness/test-support" }
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
test-support = ["tickloop-harness/engine"]
