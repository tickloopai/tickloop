[package]
name = "tickloop-code-client"
description = "AgentAccess client: the Unix socket transport, recovery and starting the local daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk" }
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
tickloop-code-access = { path = "../access" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-packages = { path = "../../tick/packages" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
