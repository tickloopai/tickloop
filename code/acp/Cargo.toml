[package]
name = "tickloop-code-acp"
description = "Stable ACP stdio adapter over managed AgentAccess executions"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["base", "model", "transcript"] }
agent-client-protocol = "=3.4.0"
base64 = "0.22"
futures = "0.3"
libc = "0.2"
serde = "1"
serde_json = "1"
tickloop-code-client = { path = "../client" }
tickloop-code-settings = { path = "../settings" }
tickloop-code-access = { path = "../access" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt", "compat"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
