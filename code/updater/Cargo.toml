[package]
name = "tickloop-code-updater"
description = "Versioned installation, update checks and pinned executable bundles"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk" }
anyhow = "1"
flate2 = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
