[package]
name = "tickloop-code-console"
description = "Agent Console: the terminal View that reaches Agents through AgentAccess"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["artifacts", "model", "tools"] }
arboard = { version = "3", features = ["wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
crossterm = "0.29"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = { version = "2.7", features = ["inline"] }
tempfile = "3"
thiserror = "2"
tickloop-code-access = { path = "../access" }
tickloop-code-client = { path = "../client" }
tickloop-code-settings = { path = "../settings" }
tickloop-tick-installer = { path = "../../tick/installer" }
tickloop-code-updater = { path = "../updater" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tickloop-ui = { path = "../../ui", features = ["code-highlight"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16.2"

[dev-dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["engine", "test-support"] }
tickloop-code-local-environment = { path = "../local-environment" }
tickloop-code-settings = { path = "../settings", features = ["test-support"] }
jsonschema = { version = "0.56", default-features = false }
portable-pty = "0.9"
tickloop-code-access = { path = "../access", features = ["test-support"] }
tickloop-code-daemon = { path = "../daemon" }
tickloop-tickhost = { path = "../../tickhost/host" }
tokio = { version = "1", features = ["full", "test-util"] }
