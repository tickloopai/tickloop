[package]
name = "tickloop-code-daemon"
description = "Agent daemon and worker processes: the AgentAccess server and the embedded Agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tickloop-code-local-environment = { path = "../local-environment" }
tickloop-harness = { path = "../../harness/sdk", features = ["policy"] }
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
tickloop-code-access = { path = "../access" }
tickloop-harness-artifacts = { path = "../../harness/artifacts" }
tickloop-code-client = { path = "../client" }
tickloop-code-settings = { path = "../settings" }
tickloop-harness-model = { path = "../../harness/model" }
tickloop-harness-protocol = { path = "../../harness/protocol" }
tickloop-harness-runtime = { path = "../../harness/runtime" }
tickloop-harness-tools = { path = "../../harness/tools" }
tickloop-code-updater = { path = "../updater" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost = { path = "../../tickhost/host" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tickloop-code-settings = { path = "../settings", features = ["test-support"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
tempfile = "3"
tickloop-code-access = { path = "../access", features = ["test-support"] }
tickloop-harness-base = { path = "../../harness/base" }
tickloop-harness-test-support = { path = "../../harness/test-support" }
tickloop-harness-transcript = { path = "../../harness/transcript" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
unicode-width = "0.2"
