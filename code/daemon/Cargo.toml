[package]
name = "tickloop-code-daemon"
description = "Agent daemon and worker processes: the AgentAccess server and the embedded Agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tickloop-harness = { path = "../../harness/sdk", features = ["artifacts", "engine", "model", "policy", "tools", "connector"] }
tickloop-code-local-environment = { path = "../local-environment" }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
tickloop-code-access = { path = "../access" }
tickloop-code-client = { path = "../client" }
tickloop-code-settings = { path = "../settings" }
tickloop-code-updater = { path = "../updater" }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-plugins = { path = "../../tick/plugins" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tickhost = { path = "../../tickhost/host" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["test-support", "transcript"] }
tickloop-code-settings = { path = "../settings", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
tempfile = "3"
tickloop-code-access = { path = "../access", features = ["test-support"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
unicode-width = "0.2"
