[package]
name = "tickloop-code"
description = "The tickloop executable: the Console, the daemon and worker entries, the Tick package and plugin commands, and their end-to-end tests"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
default-run = "tickloop"
autobins = false
autotests = false

[lib]
doctest = false

[[bin]]
name = "tickloop"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "cli_fixture"
path = "tests/support/cli_fixture_main.rs"
harness = false

[dependencies]
tickloop-harness = { path = "../../harness/sdk" }
crossterm = "0.29"
serde_json = "1"
tickloop-code-access = { path = "../access" }
tickloop-code-client = { path = "../client" }
tickloop-code-settings = { path = "../settings" }
tickloop-code-console = { path = "../console" }
tickloop-code-daemon = { path = "../daemon" }
tickloop-tick-installer = { path = "../../tick/installer" }
tickloop-code-updater = { path = "../updater" }
tickloop-tick-packages = { path = "../../tick/packages" }
tickloop-tick-plugins = { path = "../../tick/plugins" }
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tickloop-harness = { path = "../../harness/sdk", features = ["artifacts", "engine", "model", "test-support"] }
tickloop-code-local-environment = { path = "../local-environment" }
tickloop-code-settings = { path = "../settings", features = ["test-support"] }
async-trait = "0.1"
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
percent-encoding = "2"
portable-pty = "0.9"
regex = "1"
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-streamable-http-client"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
shell-words = "1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tickloop-code-access = { path = "../access", features = ["test-support"] }
tickloop-ids = { path = "../../tick/ids" }
tickloop-tick-protocol = { path = "../../tick/protocol" }
tickloop-tick-oauth-test-server = { path = "../../tick/oauth-test-server" }
tickloop-tickhost = { path = "../../tickhost/host" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16.2"
