[package]
name = "tickloop-ui"
description = "Shared terminal presentation rules for Tick Commands"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tickloop_ui"
doctest = false

[dependencies]
pulldown-cmark = "0.13"
ratatui = "0.30"
unicode-width = "0.2"
unicode-segmentation = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"], optional = true }
lru = { version = "0.18", optional = true }

[features]
# Colours fenced code in Markdown the way Claude Code's cli-highlight does.
code-highlight = ["dep:syntect", "dep:lru"]
