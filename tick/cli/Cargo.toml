[package]
name = "tickloop-tick"
description = "The tick command: runs a financial Tick on a provider as `tick <provider> <tick>`"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tick_cli"
doctest = false

[[bin]]
name = "tick"
path = "src/main.rs"

[features]
live-api = []

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
longbridge = { git = "https://github.com/longbridge/openapi", rev = "5929410" }
ratatui = "0.30"
serde_json = "1"
tickloop-tickhost-connect = { path = "../../tickhost/connect" }
tickloop-tick-builtin = { path = "../providers/builtin" }
tickloop-tick-futu = { path = "../providers/futu" }
tickloop-tick-longbridge = { path = "../providers/longbridge" }
tickloop-tick-market = { path = "../market" }
tickloop-tick-protocol = { path = "../protocol" }
tickloop-tick-provider = { path = "../provider" }
tickloop-tick-sdk = { path = "../sdk" }
tickloop-ui = { path = "../../crates/ui" }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }

[dev-dependencies]
async-trait = "0.1"
libc = "0.2"
tempfile = "3"
tickloop-tickhost = { path = "../../tickhost/host" }
tokio = { version = "1", features = ["test-util"] }
uuid = { version = "1", features = ["v4"] }
