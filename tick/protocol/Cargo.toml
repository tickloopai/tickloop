[package]
name = "tickloop-tick-protocol"
description = "The Tick standard: protocol versions, methods, frame types, limits and Tick Instance identities"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tick_protocol"
doctest = false

[dependencies]
jsonschema = { version = "0.56.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = "1"
