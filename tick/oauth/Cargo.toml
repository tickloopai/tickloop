[package]
name = "tickloop-tick-oauth"
description = "The standard OAuth 2.0 client of Tick package logins: server metadata, client registration, device authorization, token refresh and revocation, over an HTTP client its caller configures"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tick_oauth"
doctest = false

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tickloop-tick-packages = { path = "../packages" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tickloop-tick-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
