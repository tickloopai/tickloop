[package]
name = "tickloop-tick-test-support"
description = "Test-only mock quotes, account, news, options, community posts and earnings release, and the tick-mock executable that runs a Tick on them"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tick_test_support"
doctest = false

[[bin]]
name = "tick-mock"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde_json = "1"
tickloop-tick-command = { path = "../command" }
tickloop-tick-market = { path = "../market" }
tickloop-tick-provider = { path = "../provider" }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
time-tz = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tickloop-tick-protocol = { path = "../protocol" }
